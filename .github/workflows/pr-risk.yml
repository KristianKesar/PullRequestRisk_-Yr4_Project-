# pr-risk.yml - Kristian Kesar, C00296348
#
# runs my own code on every PR now instead of the linter:
#   PR opened/updated -> pr-risk grabs the changed files from github
#   -> works out the features -> posts (or updates) a comment on the PR
#
# the model's risk score gets added to the comment later on

name: PR Risk

on:
  pull_request:
    types: [opened, synchronize, reopened]

# only allowed to read the code and write PR comments, nothing else
permissions:
  contents: read
  pull-requests: write

jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # installs my project, which gives the pr-risk command
      - run: pip install .

      - name: Look at the PR and comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pr-risk comment --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"

# heads up: PRs from forks only get a read only token so commenting fails on those,
# so test with branches in this repo
