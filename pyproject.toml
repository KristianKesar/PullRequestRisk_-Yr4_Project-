# project settings + what needs installing

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-risk-predictor"
version = "0.2.0"
description = "Scores GitHub pull requests for defect risk and explains why"
authors = [{ name = "Kristian Kesar" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# extra stuff for training + testing, install with: pip install -e ".[dev]"
dev = ["pytest", "ruff", "pandas>=2.0", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]   # so the tests can find the code
testpaths = ["tests"]

[tool.ruff]
line-length = 100
