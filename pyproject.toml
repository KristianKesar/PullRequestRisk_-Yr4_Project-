# pyproject.toml
# Kristian Kesar, C00296348
# Project metadata and dependencies for the PR Risk Predictor.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-risk-predictor"
version = "0.1.0"
description = "Scores GitHub pull requests for defect risk and explains why"
authors = [{ name = "Kristian Kesar" }]
requires-python = ">=3.10"
dependencies = []          # model libraries (pandas, scikit-learn, shap) added in later iterations

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]       # lets tests import pr_risk without installing
testpaths = ["tests"]
